name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The rules engine is Rust, built to public/motw.wasm (the runner has rustup; add the WebAssembly target).
      - run: rustup target add wasm32-unknown-unknown
      - run: npm run wasm
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:rust
      - run: npx wrangler deploy --dry-run --outdir dist
