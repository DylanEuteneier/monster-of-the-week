<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monster of the Week</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiny5&family=Rubik:ital,wght@0,400;0,500;0,600;1,400&display=swap">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar" id="header"></header>
  <nav class="seatbar" id="seatbar" hidden aria-label="Hotseat seats"></nav>

  <main class="table">
    <section class="panel players-strip" id="players" aria-label="Slayer groups"></section>
    <section class="panel" id="board" aria-label="The island"></section>
    <section class="panel" id="phase" aria-label="Current phase"></section>
  </main>

  <section class="hand" id="hand" aria-label="Your hand"></section>

  <div class="overlay-buttons overlay-buttons-top">
    <button class="btn" data-action="toggle-overlay" data-target="log-overlay">Log</button>
    <button class="btn" data-action="toggle-overlay" data-target="chat-overlay">Table talk <span class="tag" id="chat-unread" hidden></span></button>
  </div>
  <aside class="overlay panel" id="log-overlay" hidden aria-label="Log">
    <button class="btn overlay-close" data-action="toggle-overlay" data-target="log-overlay" aria-label="Close the log">×</button>
    <div id="log"></div>
  </aside>
  <aside class="overlay panel chat" id="chat-overlay" hidden aria-label="Table talk">
    <button class="btn overlay-close" data-action="toggle-overlay" data-target="chat-overlay" aria-label="Close table talk">×</button>
    <h2>Table talk</h2>
    <div class="chat-lines" id="chat-lines"></div>
    <form class="chat-form" id="chat-form" autocomplete="off">
      <input class="chat-input" id="chat-input" maxlength="280" placeholder="Say something…" aria-label="Chat message">
      <button class="btn" type="submit">Send</button>
    </form>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <noscript>This table needs JavaScript.</noscript>
  <script type="module" src="/app.js"></script>
</body>
</html>
