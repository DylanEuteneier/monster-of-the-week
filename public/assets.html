<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monster of the Week — Assets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiny5&family=Rubik:ital,wght@0,400;0,500;0,600;1,400&display=swap">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <h1>MONSTER OF THE WEEK</h1>
    <span class="phase-label">Assets</span>
    <span class="inline small"><a href="/host">Host page</a></span>
  </header>

  <main class="assets-page stack">
    <section class="panel">
      <div class="row-between"><h2>Coverage</h2><span class="small muted" id="coverage"></span></div>
      <p class="small muted">Every piece of content in <span class="mono">spec.json</span>, with its sprite where one is drawn. Sprites are served from <span class="mono">/assets/sprites/&lt;id&gt;.png</span>; the palette and pixel data from <span class="mono">/assets/sprites.json</span>. Edit <span class="mono">assets/sprites.py</span> and run <span class="mono">npm run assets</span> to rebuild.</p>
    </section>
    <section class="panel" id="cards"></section>
    <div id="pieces" class="stack"></div>
    <section class="panel">
      <h2>Palette</h2>
      <div class="palette" id="palette"></div>
    </section>
  </main>

  <script type="module" src="/assets.js"></script>
</body>
</html>
